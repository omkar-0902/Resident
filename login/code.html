<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>

              "on-primary": "#003918",

              "outline": "#859585",
              "inverse-surface": "#d2e7df",
              "surface-variant": "#263833",
              "secondary-container": "#125136",
              "surface": "#051612",

<style>
        body {
            background-color: #051612;
            color: #d2e7df;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(13, 31, 26, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden">
<!-- Status Bar (iOS Style) -->
<div class="w-full px-8 py-4 flex justify-between items-center z-50">
<div class="text-sm font-semibold font-body">9:41</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">signal_cellular_alt</span>
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="material-symbols-outlined text-sm">battery_full</span>
</div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-8 relative">
<!-- Abstract Background Glows -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[80px]"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-secondary-container/20 rounded-full blur-[100px]"></div>
<!-- Logo Section -->
<div class="mb-12 flex flex-col items-center">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-2xl bg-surface-container border border-outline-variant/20 shadow-xl">
<span class="material-symbols-outlined text-[#00E676] text-4xl" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-headline text-3xl font-bold tracking-tighter text-on-surface uppercase">EcoTrack</h1>
<p class="font-label text-xs tracking-[0.2em] text-on-surface-variant uppercase mt-1">Sustainability Hub</p>
</div>
<!-- Login Form Container -->
<div class="w-full max-w-md space-y-6">
<div class="space-y-4">
<!-- Email Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl group-focus-within:text-primary transition-colors">person</span>
</div>
<input class="w-full pl-12 pr-4 py-4 rounded-2xl border-none focus:ring-2 focus:ring-primary/30 font-body placeholder:text-on-surface-variant/50 transition-all" placeholder="Username" style="background-color: #11231E; color: #F0FAF4;" type="text"/>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full pl-12 pr-12 py-4 rounded-2xl border-none focus:ring-2 focus:ring-primary/30 font-body placeholder:text-on-surface-variant/50 transition-all" placeholder="Password" style="background-color: #11231E; color: #F0FAF4;" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center">
<span class="material-symbols-outlined text-on-surface-variant text-xl">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end px-1">
<a class="text-sm font-medium hover:opacity-80 transition-opacity" href="#" style="color: #7CB896;">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-[#00E676] text-[#003918] font-headline font-bold py-4 rounded-full shadow-[0_0_20px_rgba(0,230,118,0.2)] active:scale-95 transition-all uppercase tracking-widest text-sm">
                Login
            </button>
<!-- Divider -->
<!-- Social Sign-in -->
</div>
<!-- Register Link -->
<div class="mt-12 mb-8">
<p class="text-on-surface-variant text-sm font-body">
                New here? <a class="text-[#00E676] font-semibold hover:underline underline-offset-4" href="#">Register</a>
</p>
</div>
</main>
<!-- Footer Decorative Image -->
<div class="w-full h-32 relative overflow-hidden opacity-30 pointer-events-none">
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent z-10"></div>
<img class="w-full h-full object-cover grayscale" data-alt="abstract close-up of geometric solar panel patterns with deep shadows and neon green highlights" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDa_Yx1RveykWGlwXcPY1t4VyhDZK1zUeDe9nxRHiB4iEb2ugLHNScPpWx9ks5Y49jNCkQZDkgNfCp4C3A0asB4ylK7AVEl3H3GhV2LIraW_xXuwTMDvd_yX7ln1QAX9BAK6u1ICzk5AUOgWhNy_P1mXpu2rO93BZjw93jpbuYkJr5TLAlXWfitzIBBlAlyx-0B6MYTFLH_2yfcsysPys7XGtc4-kheQ2uXV2-M7nl4dyl8ROcxsTvEh4qomTD7jyxDfhym1it_XA"/>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-2">
<div class="w-32 h-1.5 bg-on-surface/20 rounded-full"></div>
</div>
</body></html>
