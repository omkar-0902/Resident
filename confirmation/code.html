</p>
</div>
<!-- Info Card (Asymmetric Layout) -->
<div class="w-full surface-container bg-surface-container-low rounded-xl p-6 mb-12 border border-outline-variant/10 relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>

</div>

</div>
<div class="space-y-4">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm">location_on</span>
</div>
<div>
<div class="text-[11px] text-on-surface-variant font-medium">Collection Point</div>
<div class="text-sm text-on-surface">Building C, Entrance 4</div>
</div>
</div>

</div>
</div>
</div>
