<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#6a3c03",
              "on-tertiary": "#4b2800",
              "background": "#051612",
              "error-container": "#93000a",
              "on-tertiary-container": "#794810",
              "tertiary": "#ffdec4",
              "primary-fixed-dim": "#00e475",
              "surface-container-low": "#0d1f1a",
              "surface-container-highest": "#263833",
              "surface-dim": "#051612",
              "on-secondary": "#003823",
              "on-error-container": "#ffdad6",
              "secondary-fixed-dim": "#97d4b0",
              "on-primary": "#003918",
              "on-tertiary-fixed": "#2d1600",
              "on-primary-container": "#00612e",
              "on-secondary-fixed-variant": "#125136",
              "surface-container-high": "#1c2d28",
              "primary": "#75ff9e",
              "on-primary-fixed-variant": "#005226",
              "outline-variant": "#3b4a3d",
              "tertiary-fixed-dim": "#fdb878",
              "tertiary-fixed": "#ffdcbf",
              "on-surface": "#d2e7df",
              "secondary-fixed": "#b2f0cb",
              "inverse-on-surface": "#22342e",
              "tertiary-container": "#ffba79",
              "primary-fixed": "#62ff96",
              "on-secondary-container": "#86c2a0",
              "on-primary-fixed": "#00210b",
              "secondary": "#97d4b0",
              "surface-bright": "#2b3d37",
              "error": "#ffb4ab",
              "surface-container-lowest": "#02110d",
              "on-surface-variant": "#bacbb9",
              "on-background": "#d2e7df",
              "surface-tint": "#00e475",
              "outline": "#859585",
              "inverse-surface": "#d2e7df",
              "surface-variant": "#263833",
              "secondary-container": "#125136",
              "surface": "#051612",
              "on-secondary-fixed": "#002112",
              "inverse-primary": "#006d35",
              "primary-container": "#00e676",
              "surface-container": "#11231e",
              "on-error": "#690005"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .dot-grid {
            background-image: radial-gradient(circle, #1c2d28 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-between bg-surface-container-low overflow-hidden">
<!-- Subtle City Dot-Grid Pattern -->
<div class="absolute inset-0 dot-grid opacity-40 pointer-events-none"></div>
<!-- Status Bar Simulation -->
<div class="w-full px-8 pt-4 flex justify-between items-center z-10">
<span class="text-xs font-medium font-label tracking-tight">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[14px]">wifi</span>
<span class="material-symbols-outlined text-[14px]">battery_full</span>
</div>
</div>
<!-- Central Branding Section -->
<div class="flex flex-col items-center justify-center flex-grow z-10 px-6">
<!-- EcoTrack Logo Construction -->
<div class="relative mb-8 group">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-primary-container/20 blur-3xl rounded-full scale-150 group-hover:bg-primary-container/30 transition-all duration-700"></div>
<div class="relative flex items-center justify-center">
<!-- The "Leaf-to-Pin" Icon Visual -->
<div class="w-24 h-24 bg-surface-container-highest rounded-3xl flex items-center justify-center shadow-2xl border border-outline-variant/10">
<span class="material-symbols-outlined text-primary-container text-6xl" style="font-variation-settings: 'FILL' 1;">eco</span>
<div class="absolute -bottom-1 w-4 h-4 bg-primary-container rotate-45 transform translate-y-1/2"></div>
</div>
</div>
</div>
<!-- Brand Typography -->
<div class="text-center space-y-3">
<h1 class="font-headline font-bold text-5xl tracking-tighter text-on-surface">
                    Eco<span class="text-primary-container">Track</span>
</h1>
<p class="font-label text-on-surface-variant tracking-[0.15em] text-xs uppercase leading-relaxed">
                    Cleaner city. Smarter living.
                </p>
</div>
</div>
<!-- Bottom Footer & Home Indicator -->
<div class="w-full pb-10 px-12 flex flex-col items-center z-10">
<!-- Loading Indicator / Tech HUD detail -->
<div class="w-full max-w-[200px] h-[2px] bg-surface-container-highest rounded-full overflow-hidden mb-12">
<div class="h-full bg-primary-container w-1/3 rounded-full"></div>
</div>
<div class="text-[10px] font-label text-on-surface-variant/40 uppercase tracking-[0.2em] mb-8">
                v2.4.0 • Node 04B-District
            </div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1.5 bg-on-surface/20 rounded-full"></div>
</div>
<!-- Decorative Aesthetic Accents (Asymmetry) -->
<div class="absolute top-1/4 -right-20 w-64 h-64 bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-primary-container/5 blur-[140px] rounded-full"></div>
</main>
<!-- Structural Overlay (Screen Frame for Presentation) -->
<div class="fixed inset-0 pointer-events-none border-[12px] border-surface-container-lowest/20 rounded-[48px] m-2"></div>
</body></html>
