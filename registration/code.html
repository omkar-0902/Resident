<h1 class="font-headline text-4xl font-bold text-on-surface leading-tight tracking-tight uppercase">Join the <br/><span class="text-primary-container">EcoTrack</span> Hub</h1>
<p class="text-on-surface-variant mt-3 font-medium">Create your credentials to manage your smart residence.</p>
</header>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold ml-1">Username</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/30 transition-all font-headline font-medium tracking-wider" placeholder="ALEX_RIVERA_4B" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/50 group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold ml-1">Phone Number</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/30 transition-all" placeholder="+1 (555) 000-4242" type="tel"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/50 group-focus-within:text-primary transition-colors">call</span>
</div>
</div>

<label class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold ml-1">Secure Key</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/30 transition-all" type="password" value="••••••••••••"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/50 group-focus-within:text-primary transition-colors">lock</span>
</div>

<div class="pt-2 flex flex-col gap-2">
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,230,118,0.4)]"></div>
<div class="flex-1 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,230,118,0.4)]"></div>
<div class="flex-1 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,230,118,0.4)]"></div>

<span class="text-[10px] text-primary-container font-bold uppercase tracking-widest">Strength: High</span>
<span class="text-[10px] text-on-surface-variant uppercase tracking-widest">Min 8 chars</span>
</div>
</div>
</div>
